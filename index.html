<!DOCTYPE html>
<html lang="uk" class="min-h-screen">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Бінарні Лампи | Інтерактивний Урок</title>
    <!-- Tailwind CSS для стилізації -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Захист від випадкового зуму та виділення тексту на телефонах */
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        /* Ефекти світіння ламп */
        .bulb-on {
            background: radial-gradient(circle, #fef08a 0%, #eab308 60%, #ca8a04 100%);
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.6);
        }
        .bulb-off {
            background: radial-gradient(circle, #475569 0%, #1e293b 70%, #0f172a 100%);
            box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.5);
        }

        /* Адаптація спеціально для горизонтального режиму (Landscape) на смартфонах */
        @media (max-height: 500px) and (orientation: landscape) {
            header { padding-top: 0.25rem !important; padding-bottom: 0.25rem !important; }
            h1 { font-size: 1rem !important; }
            .landscape-compact { padding: 0.5rem !important; margin-bottom: 0.5rem !important; }
            .landscape-gap { gap: 0.25rem !important; }
            .landscape-text { font-size: 1.25rem !important; }
            .bulb-dynamic { width: 2.75rem !important; height: 2.75rem !important; }
            .bulb-label { margin-top: 0 !important; font-size: 9px !important; }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between selection:bg-yellow-500 selection:text-black">

    <header class="w-full bg-slate-900 border-b border-slate-800 py-3 px-4 shadow-md z-10">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-xl bg-yellow-500/20 border border-yellow-500/50 flex items-center justify-center text-yellow-400 font-bold shadow-inner">
                    💡
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white">CS50 Binary Lab</h1>
                </div>
            </div>
            
            <!-- Перемикач розрядності бітів -->
            <div class="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700">
                <span class="text-[10px] font-medium text-slate-400 px-2 uppercase">Розрядність:</span>
                <button onclick="setBitWidth(8)" id="btn-8" class="px-2 py-1 rounded-lg text-xs font-semibold transition-all bg-yellow-500 text-slate-950 shadow">8 біт</button>
                <button onclick="setBitWidth(12)" id="btn-12" class="px-2 py-1 rounded-lg text-xs font-semibold transition-all text-slate-300 hover:text-white">12 біт</button>
                <button onclick="setBitWidth(16)" id="btn-16" class="px-2 py-1 rounded-lg text-xs font-semibold transition-all text-slate-300 hover:text-white">16 біт</button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-2 sm:p-4 flex flex-col justify-center items-center">
        
        <!-- Картка завдання -->
        <div id="challenge-banner" class="w-full bg-gradient-to-r from-amber-500/10 via-yellow-500/10 to-amber-500/10 border border-amber-500/30 rounded-2xl p-2 mb-3 hidden backdrop-blur-sm shadow-lg text-center animate-pulse landscape-compact">
            <span class="text-[10px] font-bold uppercase tracking-wider text-amber-400 block">⚡ Режим завдання</span>
            <p class="text-xs sm:text-sm text-slate-300">Зберіть число: <strong id="target-number" class="text-xl sm:text-2xl text-yellow-400 font-extrabold mx-1">0</strong></p>
            <div id="success-msg" class="text-emerald-400 font-bold text-xs mt-1 hidden">🎉 Чудово! Число зібрано вірно!</div>
        </div>

        <!-- Панель значень (Dashboard) -->
        <div class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-3 sm:p-6 shadow-2xl backdrop-blur-md mb-4 landscape-compact grid grid-cols-3 gap-2 sm:gap-4 text-center landscape-gap">
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-2 sm:p-4 flex flex-col justify-center">
                <span class="text-[9px] sm:text-xs uppercase font-semibold text-slate-400 tracking-wider hidden sm:block">Десяткове (Dec)</span>
                <span class="text-[9px] uppercase font-semibold text-slate-400 sm:hidden">Dec</span>
                <span id="val-dec" class="text-xl sm:text-3xl font-extrabold text-yellow-400 mt-1 landscape-text">0</span>
            </div>
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-2 sm:p-4 flex flex-col justify-center">
                <span class="text-[9px] sm:text-xs uppercase font-semibold text-slate-400 tracking-wider hidden sm:block">Шістнадцяткове</span>
                <span class="text-[9px] uppercase font-semibold text-slate-400 sm:hidden">Hex</span>
                <span id="val-hex" class="text-xl sm:text-3xl font-extrabold text-cyan-400 mt-1 landscape-text">0x0</span>
            </div>
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-2 sm:p-4 flex flex-col justify-center">
                <span class="text-[9px] sm:text-xs uppercase font-semibold text-slate-400 tracking-wider hidden sm:block">Символ ASCII</span>
                <span class="text-[9px] uppercase font-semibold text-slate-400 sm:hidden">ASCII</span>
                <span id="val-ascii" class="text-xl sm:text-3xl font-extrabold text-emerald-400 mt-1 landscape-text">—</span>
            </div>
        </div>

        <!-- Контейнер для ламп -->
        <div class="w-full bg-slate-900/60 border border-slate-800 rounded-2xl p-3 sm:p-6 shadow-inner mb-4 landscape-compact">
            <div id="bulbs-container" class="grid grid-cols-4 sm:grid-cols-8 gap-2 sm:gap-4 justify-items-center landscape-gap">
                <!-- Лампи генеруються за допомогою JavaScript -->
            </div>
        </div>

        <!-- Кнопки керування -->
        <div class="flex flex-wrap justify-center gap-2 w-full">
            <button onclick="resetBits()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold text-xs transition shadow flex items-center gap-2">
                🔄 Скинути все
            </button>
            <button onclick="toggleChallengeMode()" id="challenge-btn" class="px-4 py-2 rounded-xl bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold text-xs transition shadow-lg shadow-yellow-500/20 flex items-center gap-2">
                🎯 Випадкове число
            </button>
        </div>

    </main>

    <footer class="w-full text-center py-2 text-[10px] text-slate-500 border-t border-slate-900 mt-auto">
        Створено для інтерактивних уроків інформатики.
    </footer>

    <script>
        // Стан додатку
        let bitWidth = 8;
        let bits = new Array(16).fill(0); // Підтримка до 16 бітів
        let isChallengeActive = false;
        let targetValue = 0;

        // Ініціалізація під час завантаження сторінки
        window.onload = function() {
            renderBulbs();
            updateDisplay();
        };

        // Зміна розрядності бітів
        function setBitWidth(width) {
            bitWidth = width;
            // Оновлення стилів кнопок вибору розрядності
            [8, 12, 16].forEach(w => {
                const btn = document.getElementById(`btn-${w}`);
                if (w === width) {
                    btn.className = "px-2 py-1 rounded-lg text-xs font-semibold transition-all bg-yellow-500 text-slate-950 shadow";
                } else {
                    btn.className = "px-2 py-1 rounded-lg text-xs font-semibold transition-all text-slate-300 hover:text-white";
                }
            });
            renderBulbs();
            updateDisplay();
            if (isChallengeActive) generateNewChallenge();
        }

        // Динамічна генерація ламп залежно від обраної розрядності
        function renderBulbs() {
            const container = document.getElementById('bulbs-container');
            container.innerHTML = '';
            
            if (bitWidth === 8) {
                container.className = "grid grid-cols-4 sm:grid-cols-8 gap-2 sm:gap-4 justify-items-center landscape-gap";
            } else if (bitWidth === 12) {
                container.className = "grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-12 gap-2 sm:gap-3 justify-items-center landscape-gap";
            } else if (bitWidth === 16) {
                container.className = "grid grid-cols-4 sm:grid-cols-8 lg:grid-cols-16 gap-1 sm:gap-2 justify-items-center landscape-gap";
            }

            for (let i = 0; i < bitWidth; i++) {
                const power = bitWidth - 1 - i;
                const weight = Math.pow(2, power);
                const isOn = bits[i] === 1;

                const bulbWrapper = document.createElement('div');
                bulbWrapper.className = "flex flex-col items-center group cursor-pointer select-none";
                
                // Миттєва реакція на дотик/кліки без затримки
                bulbWrapper.onpointerdown = (e) => {
                    e.preventDefault(); 
                    toggleBit(i);
                };

                const bulb = document.createElement('div');
                bulb.className = `bulb-dynamic w-12 h-12 sm:w-14 sm:h-14 lg:w-16 lg:h-16 rounded-full flex items-center justify-center transition-all duration-200 ${isOn ? 'bulb-on scale-105' : 'bulb-off border border-slate-700'}`;
                
                bulb.innerHTML = `<span class="text-sm sm:text-lg font-black ${isOn ? 'text-slate-950 drop-shadow' : 'text-slate-400'} pointer-events-none">${bits[i]}</span>`;

                const label = document.createElement('span');
                label.className = "bulb-label text-[10px] font-semibold text-slate-400 mt-1 group-hover:text-yellow-400 transition pointer-events-none";
                label.innerText = weight;

                bulbWrapper.appendChild(bulb);
                bulbWrapper.appendChild(label);
                container.appendChild(bulbWrapper);
            }
        }

        // Перемикання стану конкретного біта
        function toggleBit(index) {
            bits[index] = bits[index] === 0 ? 1 : 0;
            renderBulbs();
            updateDisplay();
            checkChallenge();
        }

        // Скидання всіх бітів у нуль
        function resetBits() {
            for (let i = 0; i < bitWidth; i++) bits[i] = 0;
            renderBulbs();
            updateDisplay();
            if (isChallengeActive) checkChallenge();
        }

        // Обчислення десяткового значення за активними бітами
        function calculateDecimal() {
            let decimal = 0;
            for (let i = 0; i < bitWidth; i++) {
                if (bits[i] === 1) decimal += Math.pow(2, bitWidth - 1 - i);
            }
            return decimal;
        }

        // Оновлення показників на екрані
        function updateDisplay() {
            const dec = calculateDecimal();
            document.getElementById('val-dec').innerText = dec;
            document.getElementById('val-hex').innerText = '0x' + dec.toString(16).toUpperCase();

            // Визначення ASCII символу
            const asciiEl = document.getElementById('val-ascii');
            if (dec >= 32 && dec <= 126) {
                asciiEl.innerText = `'${String.fromCharCode(dec)}'`;
            } else if (dec === 10) {
                asciiEl.innerText = "'\\n'";
            } else if (dec === 13) {
                asciiEl.innerText = "'\\r'";
            } else {
                asciiEl.innerText = '—';
            }
        }

        // Керування режимом випадкового завдання
        function toggleChallengeMode() {
            const banner = document.getElementById('challenge-banner');
            const btn = document.getElementById('challenge-btn');

            if (!isChallengeActive) {
                isChallengeActive = true;
                banner.classList.remove('hidden');
                btn.innerHTML = "❌ Вийти з режиму";
                btn.className = "px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold text-xs transition shadow-lg flex items-center gap-2";
                generateNewChallenge();
            } else {
                isChallengeActive = false;
                banner.classList.add('hidden');
                document.getElementById('success-msg').classList.add('hidden');
                btn.innerHTML = "🎯 Випадкове число";
                btn.className = "px-4 py-2 rounded-xl bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold text-xs transition shadow-lg flex items-center gap-2";
            }
        }

        // Генерація нового цільового числа
        function generateNewChallenge() {
            const maxVal = Math.pow(2, bitWidth) - 1;
            targetValue = Math.floor(Math.random() * (maxVal - 1)) + 1;
            document.getElementById('target-number').innerText = targetValue;
            document.getElementById('success-msg').classList.add('hidden');
            resetBits();
        }

        // Перевірка виконання завдання учнем
        function checkChallenge() {
            if (!isChallengeActive) return;
            const currentVal = calculateDecimal();
            const successMsg = document.getElementById('success-msg');
            if (currentVal === targetValue) {
                successMsg.classList.remove('hidden');
            } else {
                successMsg.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
