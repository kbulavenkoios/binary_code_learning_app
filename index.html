<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бинарные Лампочки | Интерактивный Урок</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom bulb glow effects */
        .bulb-on {
            background: radial-gradient(circle, #fef08a 0%, #eab308 60%, #ca8a04 100%);
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.6);
        }
        .bulb-off {
            background: radial-gradient(circle, #475569 0%, #1e293b 70%, #0f172a 100%);
            box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col justify-between selection:bg-yellow-500 selection:text-black">

    <header class="w-full bg-slate-900 border-b border-slate-800 py-4 px-6 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-yellow-500/20 border border-yellow-500/50 flex items-center justify-center text-yellow-400 font-bold text-xl shadow-inner">
                    💡
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">CS50 Binary Lab</h1>
                    <p class="text-xs text-slate-400">Интерактивный тренажер бинарного кода</p>
                </div>
            </div>
            
            <!-- Bit Width Selector -->
            <div class="flex items-center bg-slate-800 p-1.5 rounded-xl border border-slate-700">
                <span class="text-xs font-medium text-slate-400 px-2">Разрядность:</span>
                <button onclick="setBitWidth(8)" id="btn-8" class="px-3 py-1 rounded-lg text-xs font-semibold transition-all bg-yellow-500 text-slate-950 shadow">8 бит</button>
                <button onclick="setBitWidth(12)" id="btn-12" class="px-3 py-1 rounded-lg text-xs font-semibold transition-all text-slate-300 hover:text-white">12 бит</button>
                <button onclick="setBitWidth(16)" id="btn-16" class="px-3 py-1 rounded-lg text-xs font-semibold transition-all text-slate-300 hover:text-white">16 бит</button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center items-center">
        
        <!-- Challenge Card (Hidden by default) -->
        <div id="challenge-banner" class="w-full bg-gradient-to-r from-amber-500/10 via-yellow-500/10 to-amber-500/10 border border-amber-500/30 rounded-2xl p-4 mb-6 hidden backdrop-blur-sm shadow-lg text-center animate-pulse">
            <span class="text-xs font-bold uppercase tracking-wider text-amber-400 block mb-1">⚡ Режим задания учителя</span>
            <p class="text-sm text-slate-300">Соберите число: <strong id="target-number" class="text-2xl text-yellow-400 font-extrabold mx-2">0</strong></p>
            <div id="success-msg" class="text-emerald-400 font-bold text-sm mt-2 hidden">🎉 Отлично! Число собрано верно!</div>
        </div>

        <!-- Dashboard / Values Card -->
        <div class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-2xl backdrop-blur-md mb-8 grid grid-cols-1 sm:grid-cols-3 gap-4 text-center">
            <!-- Decimal -->
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-4 flex flex-col justify-center">
                <span class="text-xs uppercase font-semibold text-slate-400 tracking-wider">Десятичное (Dec)</span>
                <span id="val-dec" class="text-3xl font-extrabold text-yellow-400 mt-1">0</span>
            </div>
            <!-- Hexadecimal -->
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-4 flex flex-col justify-center">
                <span class="text-xs uppercase font-semibold text-slate-400 tracking-wider">Шестнадцатеричное (Hex)</span>
                <span id="val-hex" class="text-3xl font-extrabold text-cyan-400 mt-1">0x0</span>
            </div>
            <!-- ASCII Character -->
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-4 flex flex-col justify-center">
                <span class="text-xs uppercase font-semibold text-slate-400 tracking-wider">ASCII Символ</span>
                <span id="val-ascii" class="text-3xl font-extrabold text-emerald-400 mt-1">—</span>
            </div>
        </div>

        <!-- Lightbulbs Container -->
        <div class="w-full bg-slate-900/60 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-inner mb-6">
            <div id="bulbs-container" class="grid grid-cols-4 sm:grid-cols-8 gap-4 justify-items-center">
                <!-- Dynamically generated bulbs inserted here -->
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-wrap justify-center gap-4 w-full">
            <button onclick="resetBits()" class="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold text-sm transition shadow flex items-center gap-2">
                🔄 Сбросить все
            </button>
            <button onclick="toggleChallengeMode()" id="challenge-btn" class="px-6 py-3 rounded-xl bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold text-sm transition shadow-lg shadow-yellow-500/20 flex items-center gap-2">
                🎯 Задать случайное число
            </button>
        </div>

    </main>

    <footer class="w-full text-center py-4 text-xs text-slate-500 border-t border-slate-900">
        Создано для увлекательных уроков информатики в стиле Гарварда CS50. Кликайте по лампам!
    </footer>

    <script>
        // Application State
        let bitWidth = 8;
        let bits = new Array(16).fill(0); // support up to 16 bits
        let isChallengeActive = false;
        let targetValue = 0;

        // Initialize on load
        window.onload = function() {
            renderBulbs();
            updateDisplay();
        };

        // Change bit width
        function setBitWidth(width) {
            bitWidth = width;
            // Update button styles
            [8, 12, 16].forEach(w => {
                const btn = document.getElementById(`btn-${w}`);
                if (w === width) {
                    btn.className = "px-3 py-1 rounded-lg text-xs font-semibold transition-all bg-yellow-500 text-slate-950 shadow";
                } else {
                    btn.className = "px-3 py-1 rounded-lg text-xs font-semibold transition-all text-slate-300 hover:text-white";
                }
            });
            renderBulbs();
            updateDisplay();
            if (isChallengeActive) {
                generateNewChallenge();
            }
        }

        // Render lightbulbs dynamically based on bitWidth
        function renderBulbs() {
            const container = document.getElementById('bulbs-container');
            container.innerHTML = '';
            
            // Adjust grid layout classes based on bit width
            if (bitWidth === 8) {
                container.className = "grid grid-cols-4 sm:grid-cols-8 gap-4 justify-items-center";
            } else if (bitWidth === 12) {
                container.className = "grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-12 gap-3 justify-items-center";
            } else if (bitWidth === 16) {
                container.className = "grid grid-cols-4 sm:grid-cols-8 lg:grid-cols-16 gap-2 sm:gap-3 justify-items-center";
            }

            for (let i = 0; i < bitWidth; i++) {
                // Calculate weight (power of 2 from left to right or right to left standard binary)
                // Standard binary: MSB on left, LSB on right.
                const power = bitWidth - 1 - i;
                const weight = Math.pow(2, power);
                const isOn = bits[i] === 1;

                const bulbWrapper = document.createElement('div');
                bulbWrapper.className = "flex flex-col items-center group cursor-pointer select-none";
                bulbWrapper.onclick = () => toggleBit(i);

                // Bulb graphic card
                const bulb = document.createElement('div');
                bulb.className = `w-14 h-14 sm:w-16 sm:h-16 rounded-full flex items-center justify-center transition-all duration-300 ${isOn ? 'bulb-on scale-105' : 'bulb-off hover:border-slate-600 border border-slate-700'}`;
                
                // Inner icon / state text
                bulb.innerHTML = `
                    <span class="text-lg font-black ${isOn ? 'text-slate-950 drop-shadow' : 'text-slate-400'}">${bits[i]}</span>
                `;

                // Weight label below
                const label = document.createElement('span');
                label.className = "text-[11px] font-semibold text-slate-400 mt-2 group-hover:text-yellow-400 transition";
                label.innerText = weight;

                bulbWrapper.appendChild(bulb);
                bulbWrapper.appendChild(label);
                container.appendChild(bulbWrapper);
            }
        }

        // Toggle individual bit
        function toggleBit(index) {
            bits[index] = bits[index] === 0 ? 1 : 0;
            renderBulbs();
            updateDisplay();
            checkChallenge();
        }

        // Reset all bits to 0
        function resetBits() {
            for (let i = 0; i < bitWidth; i++) {
                bits[i] = 0;
            }
            renderBulbs();
            updateDisplay();
            if (isChallengeActive) {
                checkChallenge();
            }
        }

        // Calculate decimal value from active bits
        function calculateDecimal() {
            let decimal = 0;
            for (let i = 0; i < bitWidth; i++) {
                const power = bitWidth - 1 - i;
                if (bits[i] === 1) {
                    decimal += Math.pow(2, power);
                }
            }
            return decimal;
        }

        // Update all metrics on screen
        function updateDisplay() {
            const dec = calculateDecimal();
            document.getElementById('val-dec').innerText = dec;
            document.getElementById('val-hex').innerText = '0x' + dec.toString(16).toUpperCase();

            // ASCII representation (valid for printable ASCII 32 to 126, or general character)
            const asciiEl = document.getElementById('val-ascii');
            if (dec >= 32 && dec <= 126) {
                asciiEl.innerText = `'${String.fromCharCode(dec)}'`;
            } else if (dec === 10) {
                asciiEl.innerText = "'\\n'";
            } else if (dec === 13) {
                asciiEl.innerText = "'\\r'";
            } else {
                asciiEl.innerText = '—';
            }
        }

        // Challenge Mode Functions
        function toggleChallengeMode() {
            const banner = document.getElementById('challenge-banner');
            const btn = document.getElementById('challenge-btn');

            if (!isChallengeActive) {
                isChallengeActive = true;
                banner.classList.remove('hidden');
                btn.innerText = "❌ Выйти из режима задания";
                btn.className = "px-6 py-3 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold text-sm transition shadow-lg shadow-red-600/20 flex items-center gap-2";
                generateNewChallenge();
            } else {
                isChallengeActive = false;
                banner.classList.add('hidden');
                document.getElementById('success-msg').classList.add('hidden');
                btn.innerText = "🎯 Задать случайное число";
                btn.className = "px-6 py-3 rounded-xl bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold text-sm transition shadow-lg shadow-yellow-500/20 flex items-center gap-2";
            }
        }

        function generateNewChallenge() {
            const maxVal = Math.pow(2, bitWidth) - 1;
            // Generate random number between 1 and maxVal
            targetValue = Math.floor(Math.random() * (maxVal - 1)) + 1;
            document.getElementById('target-number').innerText = targetValue;
            document.getElementById('success-msg').classList.add('hidden');
            resetBits();
        }

        function checkChallenge() {
            if (!isChallengeActive) return;
            const currentVal = calculateDecimal();
            const successMsg = document.getElementById('success-msg');
            if (currentVal === targetValue) {
                successMsg.classList.remove('hidden');
            } else {
                successMsg.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
